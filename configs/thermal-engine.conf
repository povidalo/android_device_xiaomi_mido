[VIRTUAL-CPU]
algo_type virtual
trip_sensor apc1-cpu0-usr
set_point 75000
set_point_clr 70000
sensors apc1-cpu0-usr apc1-cpu1-usr apc1-cpu2-usr apc1-cpu3-usr apc1-l2-usr
weights
sampling 100
math 2

[PID-CPU4-5-6-7]
#algo_type pid
sampling 50
sensor apc1-cpu0-usr
device cpu4
set_point 90000
set_point_clr 55000
p_const 0.700000
i_const 15.000000
d_const 0.500000
i_samples 10
dev_units_per_calc 5000
freq_scale 500.000000

