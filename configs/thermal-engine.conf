# Headless server (povidalo): no board/case temperature rules. They protect
# the user's skin and the battery (CPU caps at case-therm 48/54 C, charge
# current, backlight, temp_state, modem at 70 C); on this server the battery
# is outside the case and nobody holds it, and the CPU should run at full
# speed. Removed: BATTERY_CHARGING_CTL, MODEM_PA_MITIGATION, MODEM_PROC_TEMP_MITIGATION, LCD_MONITOR_STATE, BACKLIGHT_AP_TEMP_MITIGATION, HIGH_TEMP_STATE, CCC_AP_TEMP_MITIGATION, SS-CASE-THERM, SS-CASE-THERM-1.
# Kept, protecting the silicon: SS-CPU0..7 and SS-GPU (95 C), PID-CPU* (90 C),
# CPU_MONITOR (shutdown at VIRTUAL-CPU 90 C), MONITOR-CAMERA-MSM.

# SENSOR : ALIAS

#debug
#Conf file: /vendor/etc/thermal-engine.conf

[CPU_MONITOR]
algo_type monitor
sampling 1000
sensor VIRTUAL-CPU
thresholds 90000
thresholds_clr 85000
actions shutdown
action_info 0

[MONITOR-CAMERA-MSM]
algo_type monitor
sampling 1000
sensor camera-usr
thresholds 52000 56000
thresholds_clr 47000 53000
actions camera camera
action_info 1 2

[SS-CPU7]
algo_type ss
sampling 50
sensor apc1-cpu3-usr
device cpu7
set_point 95000
set_point_clr 55000
time_constant 0

